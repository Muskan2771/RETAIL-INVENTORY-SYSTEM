{% extends 'base.html' %}
{% block content %}

<h2>Low Stock Items</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Quantity</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item.ProductID }}</td>
        <td>{{ item.ProductName }}</td>
        <td>{{ item.Quantity }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
