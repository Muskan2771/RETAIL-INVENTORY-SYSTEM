{% extends 'base.html' %}
{% block content %}

<h2>Search Products</h2>

<div class="card">
<form method="GET">
    <input type="text" name="query" placeholder="Search product">
    <button type="submit">Search</button>
</form>
</div>

<table>
<tr>
<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Quantity</th>
</tr>

{% for item in items %}
<tr>
<td>{{ item.ProductID }}</td>
<td>{{ item.ProductName }}</td>
<td>{{ item.Category }}</td>
<td>{{ item.Price }}</td>
<td>{{ item.Quantity }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
